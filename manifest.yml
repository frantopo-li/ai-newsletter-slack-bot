display_information:
  name: AI Newsletter Bot
  description: Abre un formulario al escribir /ai-newsletter
features:
  bot_user:
    display_name: AI Newsletter Bot
    always_online: true
  slash_commands:
    - command: /ai-newsletter
      description: Compartí un tip, herramienta o caso de uso de IA
      url: https://TU-APP.onrender.com/slack/events
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
settings:
  interactivity:
    is_enabled: true
    request_url: https://TU-APP.onrender.com/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false